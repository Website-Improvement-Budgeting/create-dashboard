
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrasi Approval | Budget Monitoring</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <!-- LEFT SIDE -->
        <div class="login-left">

            <img
                src="{{ url_for('static', filename='images/silog-building.png') }}"
                alt="SILOG"
                class="silog-image"
            >

        </div>

        <!-- RIGHT SIDE -->
        <div class="login-right">

            <div class="login-form-wrapper">

                <!-- HEADING -->
                <div class="login-heading">
                    <h3>
                        Registrasi Akun Approval
                    </h3>
                </div>

                <p class="login-subtitle">
                    Budget Monitoring & Approval System
                </p>

                <!-- FLASH MESSAGE -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <!-- REGISTRATION FORM -->
                <form
                    method="POST"
                    action="{{ url_for('register_approval') }}"
                >

                    <!-- USERNAME -->
                    <div class="form-group">

                        <label class="form-label" for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Masukkan username"
                            autocomplete="username"
                            required
                        >

                    </div>

                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label class="form-label" for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Buat password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                onclick="togglePassword('password', this)"
                                aria-label="Tampilkan password"
                                aria-pressed="false"
                            >
                                <i class="bi bi-eye"></i>
                            </button>

                        </div>

                    </div>

                    <!-- CONFIRM PASSWORD -->
                    <div class="form-group">

                        <label class="form-label" for="confirm_password">
                            Konfirmasi Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="confirm_password"
                                name="confirm_password"
                                class="form-control"
                                placeholder="Ulangi password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                onclick="togglePassword('confirm_password', this)"
                                aria-label="Tampilkan konfirmasi password"
                                aria-pressed="false"
                            >
                                <i class="bi bi-eye"></i>
                            </button>

                        </div>

                    </div>

                    <!-- APPROVAL CODE -->
                    <div class="form-group">

                        <label class="form-label" for="approval_code">
                            Kode Approval
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="approval_code"
                                name="approval_code"
                                class="form-control"
                                placeholder="Masukkan kode approval"
                                autocomplete="off"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                onclick="togglePassword('approval_code', this)"
                                aria-label="Tampilkan kode approval"
                                aria-pressed="false"
                            >
                                <i class="bi bi-eye"></i>
                            </button>

                        </div>

                    </div>

                    <!-- REGISTER BUTTON -->
                    <button
                        type="submit"
                        class="btn-login"
                    >
                        Daftar Akun
                    </button>

                </form>

                <!-- BACK TO LOGIN -->
                <div class="text-center mt-4">

                    <p class="mb-2">
                        Sudah memiliki akun?
                    </p>

                    <a
                        href="{{ url_for('login') }}"
                        class="register-approval-link"
                    >
                        Kembali ke Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- JavaScript -->
<script src="{{ url_for('static', filename='js/password.js') }}"></script>

</body>
</html>
